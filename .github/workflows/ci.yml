name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build dashboard
        run: pnpm --filter @runlens/dashboard run build

  reliability-gate:
    # Example of gating a release on agent reliability. Runs the production
    # agent 40x per scenario with frozen tools and fails the job if the lower
    # bound of any pass-rate interval drops below 80%.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run reliability gate
        run: pnpm --filter customer-support-example run reliability:ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runlens-report
          path: examples/customer-support/.runlens/
